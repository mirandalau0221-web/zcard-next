syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// AdminDashboardService 工作台指標(v1）。
service AdminDashboardService {
  // GetReconciliation 對賬總覽。
  rpc GetReconciliation(GetReconciliationRequest) returns (GetReconciliationReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/reconciliation" };
  }
  // ListCommissions 佣金列表(affiliate）。
  rpc ListCommissions(ListCommissionsRequest) returns (ListCommissionsReply) {
    option (google.api.http) = { get: "/api/v1/admin/affiliate/commissions" };
  }
  rpc GetDashboard(GetDashboardRequest) returns (DashboardReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard" };
  }
  // GetTraffic 流量統計（PV/UV 按天；page_views 明細表）。
  rpc GetTraffic(GetTrafficRequest) returns (GetTrafficReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/traffic" };
  }
  // GetDailyStats 歷史日結查詢（只掃 daily_stats；分站視角自動隔離）。
  rpc GetDailyStats(GetDailyStatsRequest) returns (GetDailyStatsReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/daily-stats" };
  }
  // CreateReconciliationJob 創建貨源對賬任務（時間窗 ≤31 天）。
  rpc CreateReconciliationJob(CreateReconciliationJobRequest) returns (ReconciliationJobItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/dashboard/reconciliation-jobs"
      body: "*"
    };
  }
  // GetReconciliationJob 對賬任務詳情（四態計數 + 狀態可查）。
  rpc GetReconciliationJob(GetReconciliationJobRequest) returns (ReconciliationJobItem) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/reconciliation-jobs/{id}" };
  }
  // RunReconciliationJob 執行任務（pending → processing → done/failed）。
  rpc RunReconciliationJob(RunReconciliationJobRequest) returns (ReconciliationJobItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/dashboard/reconciliation-jobs/{id}/run"
      body: "*"
    };
  }
  // ListReconciliationItems 對賬明細分頁（四態篩選）。
  rpc ListReconciliationItems(ListReconciliationItemsRequest) returns (ListReconciliationItemsReply) {
    option (google.api.http) = { get: "/api/v1/admin/dashboard/reconciliation-jobs/{id}/items" };
  }
}

message GetDailyStatsRequest {
  string start_date = 1; // yyyymmdd（空 = 近 7 天）
  string end_date = 2;
}

message DailyStatPoint {
  string date = 1;
  int64 orders = 2;
  int64 amount_cents = 3;
  int64 paid_orders = 4;
}

message GetDailyStatsReply {
  repeated DailyStatPoint points = 1;
}

message GetDashboardRequest {
  int32 trend_days = 1; // 全部圖表與排行天數：1/7/14/30，默認 7
}

message DashboardStat {
  int64 orders = 1;
  int64 revenue = 2; // 分
  int64 paid_orders = 3;
  int64 cost = 4; // 已支付訂單成本（分）
  int64 profit = 5; // 預估毛利 = net_revenue - cost（分）；成本不完整時不可用
  int64 new_users = 6; // 全站新增註冊用户
  int64 refunds = 7; // 時段內成功退款
  int64 net_revenue = 8; // 支付金額減成功退款
  int64 unknown_cost_orders = 9; // 成本不完整時不展示利潤
}

message DashboardTrendPoint {
  string date = 1;
  int64 orders = 2;
  int64 revenue = 3; // 分
  int64 paid_count = 4; // 已支付單數
  int64 cost = 5; // 已支付訂單成本（分）
  int64 profit = 6; // 預估毛利（分）
  int64 refunds = 7;
  int64 net_revenue = 8;
}

message DashboardTopProduct {
  uint64 product_id = 1;
  string name = 2;
  int64 sold_qty = 3;
  int64 revenue = 4; // 分
}

message DashboardTopChannel {
  string channel = 1;
  int64 total_count = 2;
  int64 success_count = 3;
  int64 failed_count = 4;
  uint64 channel_id = 5;
  string name = 6;
  string channel_state = 7; // active/disabled/deleted/legacy
  int64 amount = 8; // 訂單支付金額，基礎幣分
}

message DashboardPending {
  int64 pending_withdrawals = 1; // 待審核提現
  int64 pending_refunds = 2; // 待處理退款（refund_pending）
  int64 fulfilling_orders = 3; // 履約中訂單
  int64 low_stock_products = 4; // 庫存預警商品數
  int64 pending_supplier_applications = 5; // 待審對接申請（supplier_accounts applying）
  int64 open_tickets = 6; // 待回覆工單
  int64 processing_tickets = 7; // 處理中工單
  int64 payment_reviews = 9; // 到賬待核對，包含已刪除訂單
  int64 urgent_tickets = 8; // 未解決的付費加急工單，包含在上述兩項中
}

message GetTrafficRequest {
  int32 days = 1; // 7/14/30，默認 7
}

message TrafficPoint {
  string date = 1; // yyyy-mm-dd
  int64 pv = 2; // 訪問量
  int64 uv = 3; // 獨立訪客（按 IP 去重）
}

message GetTrafficReply {
  repeated TrafficPoint points = 1;
}

message DashboardReply {
  DashboardStat today = 1;
  DashboardStat last7d = 2;
  DashboardStat last30d = 3;
  repeated DashboardTrendPoint trend = 4;
  repeated DashboardTopProduct top_products = 5;
  DashboardStat yesterday = 6; // 環比基準（今日 vs 昨日）
  DashboardStat prev7d = 7; // 環比基準（近7天 vs 前7天）
  DashboardStat prev30d = 8; // 環比基準（近30天 vs 前30天）
  repeated DashboardTopChannel top_channels = 9;
  DashboardPending pending = 10;
  int64 range_start = 12;
  int64 range_end = 13;
  int64 generated_at = 14;
  uint64 subsite_id = 15;
  int64 online_users = 11; // 當前在線用户數（5 分鐘活躍窗口）
}

// ListCommissions 佣金管理列表。
message ListCommissionsRequest {
  string status = 1; // pending_confirm | available | withdrawn | reversed；空=全部
  int32 page = 2;
  int32 page_size = 3;
}

message AdminCommission {
  uint64 id = 1;
  uint64 order_id = 2;
  uint64 buyer_id = 3;
  uint64 referrer_id = 4;
  int32 tier = 5;
  double rate = 6;
  int64 base_amount = 7;
  int64 amount = 8;
  string status = 9;
  int64 available_at = 10;
  int64 created_at = 11;
}

message ListCommissionsReply {
  repeated AdminCommission commissions = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// GetReconciliation 對賬總覽（：訂單×支付×佣金三向核對基礎報表）。
message GetReconciliationRequest {
  string date = 1; // yyyymmdd；空 = 最新
}

message ReconciliationSummary {
  string date = 1;
  int64 order_paid_total = 2; // 當日已支付訂單額（分）
  int64 payment_success_total = 3; // 當日支付單成功額（分）
  int64 wallet_recharge_total = 4; // 當日錢包充值（分）
  int64 commission_total = 5; // 當日佣金計提（分）
  int64 order_count = 6;
  int64 mismatch_count = 7; // 訂單/支付額差異數（>0 需人工）
}

message GetReconciliationReply {
  ReconciliationSummary summary = 1;
}

message CreateReconciliationJobRequest {
  uint64 connection_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 start = 2 [(google.api.field_behavior) = REQUIRED]; // unix 秒
  int64 end = 3 [(google.api.field_behavior) = REQUIRED]; // unix 秒
}

message ReconciliationJobItem {
  uint64 id = 1;
  uint64 connection_id = 2;
  string status = 3; // pending | processing | done | failed
  int64 time_range_start = 4;
  int64 time_range_end = 5;
  int32 total_count = 6;
  int32 matched_count = 7;
  int32 mismatched_count = 8;
  string result_json = 9;
  int64 created_at = 10;
}

message GetReconciliationJobRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RunReconciliationJobRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListReconciliationItemsRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string status = 2; // matched | mismatched | local_only | upstream_only
  int32 page = 3;
  int32 page_size = 4;
}

message ReconciliationItemDetail {
  uint64 id = 1;
  string status = 2;
  uint64 procurement_order_id = 3;
  string local_order_no = 4;
  string upstream_order_no = 5;
  string diff_json = 6;
  int64 created_at = 7;
}

message ListReconciliationItemsReply {
  repeated ReconciliationItemDetail items = 1;
  int64 total = 2;
}
