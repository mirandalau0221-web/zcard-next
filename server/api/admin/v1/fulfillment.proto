syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminFulfillmentService 履約管理：待發貨列表 + 手動交付。
service AdminFulfillmentService {
 rpc ShipOrder(ShipOrderRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/api/v1/admin/fulfillment/{order_no}/ship" body: "*" }; }
 rpc UpdateShipping(UpdateShippingRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/api/v1/admin/fulfillment/{order_no}/shipping" body: "*" }; }
 rpc RestockReturn(RestockReturnRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/api/v1/admin/fulfillment/{order_no}/restock" body: "*" }; }

  rpc StartService(StartServiceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/admin/fulfillment/{order_no}/start" body: "*" };
  }
  // ListPending 待發貨列表（實體快遞配送及人工交付）。
  rpc ListPending(ListPendingRequest) returns (ListPendingReply) {
    option (google.api.http) = { get: "/api/v1/admin/fulfillment/pending" };
  }
  // ManualDeliver 手動交付（卡密內容或物流單號）。
  rpc ManualDeliver(ManualDeliverRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/fulfillment/{order_no}/deliver"
      body: "*"
    };
  }
  // ListDeliveries 交付記錄列表（掩碼默認）。
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesReply) {
    option (google.api.http) = { get: "/api/v1/admin/fulfillment" };
  }
}

message ListPendingRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListPendingReply {
  repeated PendingOrder orders = 1;
  bool has_more = 2; // 按訂單分頁，單頁可包含多個商品項
}

message PendingOrder {
  uint64 order_item_id = 6;
  string sku_name = 7;
  string form_answers_json = 8;
  string fulfillment_status = 9;
  uint64 assigned_admin_id = 10;
  string fulfillment_type = 11;
  string goods_type = 12;
  string order_no = 1;
  uint64 product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  int64 created_at = 5;
}

message ManualDeliverRequest {
  string service_content = 6;
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2; // 卡密內容（多行，每行一條）
  string logistics_no = 3; // 物流單號（與 content 二選一）
  string remark = 4;
  uint64 order_item_id = 5; // 多商品訂單必須指定補發商品項
}

message ListDeliveriesRequest {
  string order_no = 1;
  int32 page = 2;
  int32 page_size = 3;
  uint64 order_item_id = 4;
}

message ListDeliveriesReply {
  repeated DeliveryRecord deliveries = 1;
  int64 total = 2;
}

// DeliveryRecord 交付記錄（content=完整卡密，服務端現場解密；路由受
// order:view_delivery 權限門控 + 查看審計留痕）。
message DeliveryRecord {
  uint64 order_item_id = 11;
  string kind = 12;
  uint64 id = 1;
  string order_no = 2;
  uint64 card_id = 3;
  string content_masked = 4; // ****尾4位
  string delivered_mode = 5;
  uint64 delivered_by = 6;
  int32 fetch_count = 7;
  int64 delivered_at = 8;
  string fetched_ip = 9;
  string content = 10; // 完整卡密（管理端明文）
}

message StartServiceRequest { string order_no = 1; uint64 order_item_id = 2; }

message ShipOrderRequest { string order_no = 1; repeated uint64 item_ids = 2; string carrier = 3; string tracking_no = 4; string request_key = 5; }
message UpdateShippingRequest { string order_no = 1; uint64 shipment_id = 2; string carrier = 3; string tracking_no = 4; map<string,string> address = 5; bool received = 6; string reason = 7; }
message RestockReturnRequest { string order_no = 1; uint64 item_id = 2; int32 quantity = 3; string request_key = 4; string reason = 5; }
