syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminInstallService 在線安裝（Public——僅未安裝時可用；已安裝後 status 只讀、install 拒絕）。
// 部署形態：SQLite 零依賴起步（無需數據庫/Redis 配置），瀏覽器打開 → 設管理員 → 完成。
// 數據庫/Redis 屬部署層配置（config.yaml / env），不進安裝嚮導。
service AdminInstallService {
  // GetInstallStatus 安裝狀態 + 環境自檢（公開）。
  rpc GetInstallStatus(google.protobuf.Empty) returns (InstallStatusReply) {
    option (google.api.http) = { get: "/api/v1/admin/install/status" };
  }
  // PerformInstall 執行安裝（公開；寫管理員 + 站點信息 + 種子；已安裝返回 409）。
  // dialect=sqlite → 當前庫直接裝；mysql/postgres → 校驗連接後寫庫切換覆蓋配置
  // + 待安裝憑據文件，響應 restart_required 並自重啓（新庫上補裝完成）。
  rpc PerformInstall(PerformInstallRequest) returns (InstallStatusReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/install"
      body: "*"
    };
  }
  // TestInstallConnection 測試數據庫/Redis 連接（公開；庫不存在時自動創建）。
  rpc TestInstallConnection(TestInstallConnectionRequest) returns (TestInstallConnectionReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/install/test"
      body: "*"
    };
  }
}

message InstallStatusReply {
  bool installed = 1; // 是否已安裝
  string dialect = 2; // sqlite | mysql | postgres
  string version = 3; // 構建版本
  bool database_ok = 4; // 數據庫連通
  bool migrations_ok = 5; // 遷移已應用
  string installed_at = 6; // 安裝時間（RFC3339；未安裝為空）
  bool restart_required = 7; // 已提交庫切換，服務即將自重啓（前端輪詢至 installed）
}

message TestInstallConnectionRequest {
  string dialect = 1; // mysql | postgres（sqlite 無需測試）
  string db_host = 2;
  int32 db_port = 3;
  string db_user = 4;
  string db_password = 5;
  string db_name = 6;
  string redis_addr = 7; // mysql/postgres 必填
  string redis_password = 8;
}

message TestInstallConnectionReply {
  bool ok = 1;
  string message = 2; // 失敗原因（連接/權限/庫創建）
}

message PerformInstallRequest {
  string admin_username = 1 [(google.api.field_behavior) = REQUIRED]; // 管理員用户名
  string admin_password = 2 [(google.api.field_behavior) = REQUIRED]; // 管理員密碼（≥8 位）
  string site_name = 3; // 站點名稱（默認 ZCard 商店）
  string site_url = 4; // 站點網址（可選）
  // ── 數據庫選擇（在線安裝庫切換）──
  string dialect = 5; // sqlite（默認，當前庫直裝）| mysql | postgres
  string db_host = 6;
  int32 db_port = 7;
  string db_user = 8;
  string db_password = 9;
  string db_name = 10;
  string redis_addr = 11; // mysql/postgres 必填（SQLite 免 Redis）
  string redis_password = 12;
}
