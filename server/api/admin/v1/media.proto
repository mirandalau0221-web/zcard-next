syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminMediaService 素材庫管理：分類/上傳/列表/改名/移動/批量刪除
// （ref_count>0 需 confirm）/外鏈導入/複製鏈接。
// 上傳走 base64（10MB 圖 ~13.7MB JSON；管理面可接受，走統一中間件棧）。
service AdminMediaService {
  // CreateCategory 創建分類。
  rpc CreateCategory(CreateMediaCategoryRequest) returns (MediaCategory) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/categories"
      body: "*"
    };
  }
  // RenameCategory 分類改名。
  rpc RenameCategory(RenameMediaCategoryRequest) returns (MediaCategory) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/categories/{id}/rename"
      body: "*"
    };
  }
  // MoveCategory 分類移動。
  rpc MoveCategory(MoveMediaCategoryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/categories/{id}/move"
      body: "*"
    };
  }
  // DeleteCategory 刪除分類（有內容拒絕）。
  rpc DeleteCategory(DeleteMediaCategoryRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/admin/media/categories/{id}"
    };
  }
  // ListCategories 分類列表。
  rpc ListCategories(google.protobuf.Empty) returns (ListMediaCategoriesReply) {
    option (google.api.http) = { get: "/api/v1/admin/media/categories" };
  }
  // Upload 上傳（安全三件套：三重校驗+重編碼+10MB）。
  rpc Upload(UploadMediaRequest) returns (MediaItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/upload"
      body: "*"
    };
  }
  // ImportFromURL 外鏈導入（httpx SSRF 防護 + 同三件套）。
  rpc ImportFromURL(ImportMediaRequest) returns (MediaItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/import"
      body: "*"
    };
  }
  // ListMedia 素材列表。
  rpc ListMedia(ListMediaRequest) returns (ListMediaReply) {
    option (google.api.http) = { get: "/api/v1/admin/media" };
  }
  // RenameMedia 素材改名。
  rpc RenameMedia(RenameMediaRequest) returns (MediaItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/{id}/rename"
      body: "*"
    };
  }
  // MoveMedia 素材批量移動。
  rpc MoveMedia(MoveMediaRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/move"
      body: "*"
    };
  }
  // DeleteMedia 批量刪除（被引用未 confirm → 409 + 引用清單）。
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/media/delete"
      body: "*"
    };
  }
}

message MediaCategory {
  uint64 id = 1;
  uint64 parent_id = 2;
  string name = 3;
  int32 sort = 4;
}

message CreateMediaCategoryRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 parent_id = 2;
  int32 sort = 3;
}

message RenameMediaCategoryRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
}

message MoveMediaCategoryRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 parent_id = 2; // 0 = 移到根
}

message DeleteMediaCategoryRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListMediaCategoriesReply {
  repeated MediaCategory categories = 1;
}

message UploadMediaRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED]; // 原始文件名（含擴展名）
  string content_type = 2; // 聲明 MIME（可空——魔數兜底）
  string data_base64 = 3 [(google.api.field_behavior) = REQUIRED];
  uint64 category_id = 4;
}

message ImportMediaRequest {
  string url = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 category_id = 2;
}

message MediaItem {
  uint64 id = 1;
  uint64 category_id = 2;
  string name = 3;
  string url = 4; // /uploads/<path>
  string mime = 5;
  int64 size = 6;
  int32 width = 7;
  int32 height = 8;
  int32 ref_count = 9;
  int64 created_at = 10;
}

message ListMediaRequest {
  uint64 category_id = 1;
  string keyword = 2;
  int32 page = 3;
  int32 page_size = 4;
  // 僅未分類素材（category_id 為空；與 category_id=0「不過濾」區分）
  bool uncategorized = 5;
  string kind = 6; // image (default), video, or all
}

message ListMediaReply {
  repeated MediaItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
 int64 max_video_bytes = 5;
}

message RenameMediaRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
}

message MoveMediaRequest {
  repeated uint64 ids = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 category_id = 2; // 0 = 未分類
}

message DeleteMediaRequest {
  repeated uint64 ids = 1 [(google.api.field_behavior) = REQUIRED];
  bool confirm = 2; // ref_count>0 時必須 true
}

message DeleteMediaReply {
  int32 deleted = 1;
  repeated MediaItem referenced = 2; // 被 confirm=false 拒絕時返回引用清單
  bool need_confirm = 3;
}
