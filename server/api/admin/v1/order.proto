syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminOrderService 訂單管理。
service AdminOrderService {
  // ListOrders 訂單列表（遊標分頁）。
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersReply) {
    option (google.api.http) = { get: "/api/v1/admin/orders" };
  }
  // GetOrder 訂單詳情（含金額行+狀態事件時間線）。
  rpc GetOrder(GetAdminOrderRequest) returns (AdminOrder) {
    option (google.api.http) = { get: "/api/v1/admin/orders/{order_no}" };
  }
  // CancelOrder 取消訂單（pending 可取消）。
  rpc CancelOrder(CancelOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/orders/{order_no}/cancel"
      body: "*"
    };
  }
  // DeleteOrders 從管理列表移除已取消或已過期的未付款訂單，保留關聯記錄。
  rpc DeleteOrders(DeleteOrdersRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/admin/orders/delete"
      body: "*"
    };
  }
}

message ListOrdersRequest {
  string shipping_status = 20;
  string status = 1;
  uint64 cursor = 2;
  int32 limit = 3;
  string keyword = 4; // 訂單號或聯繫方式（包含匹配）。
  int64 start_time = 5;
  int64 end_time = 6;
  string time_field = 7; // created/paid
  uint64 channel_id = 8;
  string channel_code = 9; // 歷史無 channel_id 流水
  uint64 product_id = 10;
}

message ListOrdersReply {
  repeated AdminOrder orders = 1;
  uint64 next_cursor = 2;
}

message GetAdminOrderRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
}

// AdminOrder 管理面訂單（含成本；StripCostPrice 由 service 判權限）。
message AdminOrder {
  string shipping_status = 40;
  int64 shipping_cents = 41;
  map<string,string> shipping_address = 42;
  string shipments_json = 43;
  int32 commerce_version = 44;
  int64 paid_total_cents = 21;
  int64 paid_fee_cents = 22;
  int64 refunded_fee_cents = 23;
  int64 refunded_cents = 20; // succeeded refunds only
  uint64 id = 1;
  string order_no = 2;
  string status = 3;
  int64 total_cents = 4;
  int64 cost_cents = 5;
  uint64 user_id = 6;
  string guest_contact = 7;
  string contact = 8;
  string client_ip = 9;
  int64 created_at = 10;
  int64 paid_at = 11;
  int64 expired_at = 12;
  repeated AdminOrderItem items = 13;
  repeated AmountLine amount_lines = 14;
  repeated StatusEvent status_events = 15;
  int64 expiry_retry_at = 16;
  int32 expiry_attempts = 17;
  bool expiry_review = 18;
  string expiry_reason = 19;
}

message AdminOrderItem {
  bool shipping_collect = 40;
  string goods_type = 30;
  int64 paid_cents = 31;
  int64 shipping_cents = 32;
  int64 refunded_cents = 33;
  int64 refunded_shipping_cents = 34;
  int32 canceled_quantity = 35;
  int32 shipped_quantity = 36;
  int32 received_quantity = 37;
  int32 returned_quantity = 38;
  optional bool inventory_tracked = 39;
  string form_answers_json = 18;
  uint64 assigned_admin_id = 19;
  uint64 id = 17; // 訂單商品項 ID，人工補發使用
  uint64 product_id = 1;
  uint64 sku_id = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
  int64 amount_cents = 5;
  string fulfillment_type = 6;
  string fulfillment_status = 7;
  string name = 8; // 商品名（聯查當前）
  string sku_name = 9; // SKU 名快照
  int64 cost_cents = 10; // 成本快照（分）
  bool is_self = 11; // 自營（upstream_source_id 為空）
  uint64 upstream_source_id = 12; // 貨源連接 ID
  string upstream_source_name = 13; // 上游渠道名
  string upstream_driver = 14; // 上游驅動（zcard/dujiao_next/acg_faka）
  string upstream_product_code = 15; // 上游商品標識
  string upstream_url = 16; // 上游地址（base_url）
}

message AmountLine {
  string type = 1;
  int64 amount_cents = 2;
  string source_type = 3;
  uint64 source_id = 4;
  int32 seq = 5;
}

message StatusEvent {
  string from_status = 1;
  string to_status = 2;
  string event = 3;
  string operator = 4;
  string reason = 5;
  int64 created_at = 6;
}

message CancelOrderRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  string reason = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteOrdersRequest {
  repeated string order_nos = 1 [(google.api.field_behavior) = REQUIRED];
}
