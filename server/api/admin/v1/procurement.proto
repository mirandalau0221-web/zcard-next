syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminProcurementService 採購管理：採購單列表/詳情/手動重試/手動標記完成。
service AdminProcurementService {
 rpc ListSMS(ListProcurementsRequest) returns (SMSDiagnostics) { option (google.api.http) = { get: "/api/v1/admin/sms-intents" }; }
 rpc RetrySMS(RetrySMSRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/api/v1/admin/sms-intents/{id}/retry" body: "*" }; }

  // ListProcurements 採購單列表（按狀態過濾）。
  rpc ListProcurements(ListProcurementsRequest) returns (ListProcurementsReply) {
    option (google.api.http) = { get: "/api/v1/admin/procurements" };
  }
  // GetProcurement 採購單詳情（含採購項/密文行數）。
  rpc GetProcurement(GetProcurementRequest) returns (ProcurementOrder) {
    option (google.api.http) = { get: "/api/v1/admin/procurements/{id}" };
  }
  // RetryProcurement 手動重試（pending/submitted/polling 均可重新提交或推進輪詢）。
  rpc RetryProcurement(RetryProcurementRequest) returns (ProcurementOrder) {
    option (google.api.http) = {
      post: "/api/v1/admin/procurements/{id}/retry"
      body: "*"
    };
  }
  // MarkProcurementManual 手動標記完成/轉人工（人工拿貨後回填）。
  rpc MarkProcurementManual(MarkProcurementManualRequest) returns (ProcurementOrder) {
    option (google.api.http) = {
      post: "/api/v1/admin/procurements/{id}/manual"
      body: "*"
    };
  }
}

message ProcurementOrder {
  uint64 id = 1;
  uint64 order_item_id = 2;
  uint64 connection_id = 3;
  string upstream_order_id = 4;
  string status = 5; // pending | submitted | polling | fulfilled | rejected | refunding | refunded | manual
  string fail_strategy = 6; // auto_refund | manual
  int32 retry_count = 7;
  int64 next_retry_at = 8;
  int64 last_poll_at = 9;
  string dedupe_key = 10;
  string trace_id = 11;
  string last_error = 12;
  string upstream_refund_id = 13;
  int32 item_quantity = 14;
  int64 item_unit_cost = 15;
  int32 received_cards = 16; // 已到手卡密行數（密文行數）
  int64 created_at = 17;
  int64 updated_at = 18;
  string order_no = 19;
  string order_status = 20;
  uint64 product_id = 21;
  string product_name = 22;
  string sku_name = 23;
  string connection_name = 24;
  string connection_url = 25;
  string connection_driver = 26;
  string upstream_product_code = 27;
  int64 sale_unit_cents = 28;
  int64 sale_amount_cents = 29;
  int64 allocated_sale_cents = 30; // 整單優惠按子項金額分攤
  int64 cost_unit_cents = 31;
  int64 cost_total_cents = 32;
  int64 profit_cents = 33; // 預計毛利，未計退款和手續費
  string cost_basis = 34; // order_snapshot | unrecorded
  int32 delivered_quantity = 35;
  bool delivery_incomplete = 36; // 可發貨訂單的該商品尚未足額交付

}

message ListProcurementsRequest {
  string status = 1; // 空 = 全部
  int32 page = 2;
  int32 page_size = 3;
  string order_no = 4; // 客户訂單號精確匹配
}

message ListProcurementsReply {
  repeated ProcurementOrder procurements = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetProcurementRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message RetryProcurementRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message MarkProcurementManualRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string remark = 2;
}

message SMSDiagnostic { uint64 id=1; string order_no=2; uint64 connection_id=3; string phase=4; string state=5; string refund_status=6; string last_error=7; int32 attempts=8; int64 updated_at=9; }
message SMSDiagnostics { repeated SMSDiagnostic items=1; int64 total=2; bool sales_enabled=3; }
message RetrySMSRequest { uint64 id=1; string reason=2; }
