syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminSettingsService 設置中心（settings 表 = 運行時業務開關真理源，鐵律 7）。
// 讀寫 API；起補齊安裝嚮導狀態與分組目錄。
service AdminSettingsService {
  // ListSettings 按分組列出設置項。
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsReply) {
    option (google.api.http) = {
      get: "/api/v1/admin/settings"
    };
  }
  // ListTemplates 可用模板清單（掃描 web/storefront/templates/*/theme.json；
  // 目錄缺失回退內置 classic 清單）。
  rpc ListTemplates(google.protobuf.Empty) returns (TemplateList) {
    option (google.api.http) = {
      get: "/api/v1/admin/settings/templates"
    };
  }
  // InstallTemplate 安裝主題（zip base64；解壓校驗後原子落盤到模板目錄）。
  rpc InstallTemplate(InstallTemplateRequest) returns (TemplateItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/settings/templates/install"
      body: "*"
    };
  }
  rpc GetThemeSettings(ThemeSettingsRequest) returns (ThemeSettingsReply) {
    option (google.api.http) = { get: "/api/v1/admin/settings/themes/{key}" };
  }
  rpc SaveThemeSettings(SaveThemeSettingsRequest) returns (ThemeSettingsReply) {
    option (google.api.http) = { put: "/api/v1/admin/settings/themes/{key}" body: "*" };
  }
  rpc PreviewThemeSettings(SaveThemeSettingsRequest) returns (ThemePreviewReply) {
    option (google.api.http) = { post: "/api/v1/admin/settings/themes/{key}/preview" body: "*" };
  }
  // GetSetting 讀取單個設置項。
  rpc GetSetting(GetSettingRequest) returns (Setting) {
    option (google.api.http) = {
      get: "/api/v1/admin/settings/{group}/{key}"
    };
  }
  // UpdateSetting 更新單個設置項（value 為任意 JSON 文檔）。
  rpc UpdateSetting(UpdateSettingRequest) returns (Setting) {
    option (google.api.http) = {
      put: "/api/v1/admin/settings/{group}/{key}"
      body: "*"
    };
  }
  // UpdateSettings 批量更新（表單級保存；單事務原子寫入）。
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsReply) {
    option (google.api.http) = {
      put: "/api/v1/admin/settings"
      body: "*"
    };
  }
}

message ListSettingsRequest {
  // 可選分組過濾（site/template/trade/security/ops/notify/...）
  string group = 1;
}

message ListSettingsReply {
  repeated Setting items = 1;
}

message GetSettingRequest {
  string group = 1 [(google.api.field_behavior) = REQUIRED];
  string key = 2 [(google.api.field_behavior) = REQUIRED];
}

message UpdateSettingRequest {
  string group = 1 [(google.api.field_behavior) = REQUIRED];
  string key = 2 [(google.api.field_behavior) = REQUIRED];
  // 任意 JSON 文檔（對象/數組/標量均可），服務端原樣存儲
  string value_json = 3 [(google.api.field_behavior) = REQUIRED];
}

// Setting 設置項（value_json 為 JSON 文檔字符串）。
message Setting {
  string group = 1;
  string key = 2;
  string value_json = 3;
  // 業務顯示名稱（目錄裁決；缺失回落 key 本身）
  string label = 4;
  // 枚舉選項（如 category_nav_style: list/grid）；非枚舉鍵為空
  repeated OptionItem options = 5;
  // 敏感鍵（值已脱敏 ****；前端渲染密碼框）
  bool secret = 6;
}

// OptionItem 枚舉選項（value 入庫值，label 展示名）。
message OptionItem {
  string value = 1;
  string label = 2;
}

// UpdateSettingsRequest 批量更新項。
message UpdateSettingsRequest {
  repeated SettingUpdate items = 1;
}

message SettingUpdate {
  string group = 1 [(google.api.field_behavior) = REQUIRED];
  string key = 2 [(google.api.field_behavior) = REQUIRED];
  string value_json = 3 [(google.api.field_behavior) = REQUIRED];
}

message UpdateSettingsReply {
  int32 updated = 1;
  // Effective private entry after changing site.admin_path; omitted for other saves.
  string admin_base_path = 2;
}

// TemplateItem 可用模板。
message TemplateItem {
  string key = 1; // 模板目錄名（settings.template.pc_template 存該值）
  string name = 2; // 顯示名稱
  string desc = 3; // 描述
  string preview = 4; // 預覽圖 URL（可空）
  string author = 5; // 作者
  string version = 6; // 版本號
}

// InstallTemplateRequest 主題安裝（zip base64，對齊 media 上傳模式）。
message InstallTemplateRequest {
  string data_base64 = 1 [(google.api.field_behavior) = REQUIRED];
}

message TemplateList {
  repeated TemplateItem templates = 1;
}

message ThemeSettingsRequest { string key = 1; string theme_revision = 2; }
message SaveThemeSettingsRequest {
  string key = 1;
  string theme_revision = 2;
  string expected_revision = 3;
  string action = 4; // draft | publish | reset | rollback
  string values_json = 5;
}
message ThemeSettingsReply { string state_json = 1; }
message ThemePreviewReply { string url = 1; int64 expires_at = 2; }
