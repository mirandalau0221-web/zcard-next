syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// AdminUpdateService 在線更新（doc/在線更新方案.md ；system:update 超管專屬）。
// 更新鏈：備份 DB → 落盤下載（流式哈希+進度）→ 原子替換 → 重啓三分支；
// 重啓後本接口隨新進程復活——前端輪詢 status 直到 current==target 即成功。
service AdminUpdateService {
  // GetUpdateStatus 當前狀態（冪等輪詢；含生效源/supervisor 探測/最近 check 結果）。
  rpc GetUpdateStatus(google.protobuf.Empty) returns (UpdateStatus) {
    option (google.api.http) = { get: "/api/v1/admin/update/status" };
  }
  // CheckUpdate 手動檢查更新（源解析+manifest 驗籤；結果緩存於 status）。
  rpc CheckUpdate(google.protobuf.Empty) returns (UpdateCheckResult) {
    option (google.api.http) = {
      post: "/api/v1/admin/update/check"
      body: "*"
    };
  }
  // ApplyUpdate 觸發更新（單飛；進行中重複調用返回當前態）。
  rpc ApplyUpdate(ApplyUpdateRequest) returns (UpdateStatus) {
    option (google.api.http) = {
      post: "/api/v1/admin/update/apply"
      body: "*"
    };
  }
  // RollbackUpdate 回滾上一版本（zcard.prev）並重啓。
  rpc RollbackUpdate(google.protobuf.Empty) returns (UpdateStatus) {
    option (google.api.http) = {
      post: "/api/v1/admin/update/rollback"
      body: "*"
    };
  }
}

message ApplyUpdateRequest {
  // Version explicitly confirmed by the administrator; required for Docker.
  string version = 1;
}

// ReleaseNoteEntry 歷史版本變更記錄（manifest history 段透傳）。
message ReleaseNoteEntry {
  string version = 1;
  string channel = 2;
  string notes = 3;
  string issued_at = 4;
}

message UpdateStatus {
  // idle|checking|backing_up|downloading|applying|restarting|verifying|rolled_back|failed
  string phase = 1;
  string current_version = 2;
  string target_version = 3;
  int32 progress_percent = 4; // downloading 階段 0-100
  string error_message = 5;
  string source = 6; // 生效源展示：github | <accel 前綴> | static:<base>
  string mode = 7; // 配置模式 auto|github|accel|static
  string supervisor_kind = 8; // systemd | supervisord | none（none=裸跑，UI 警示）
  bool has_update = 9;
  string notes = 10; // 最近一次 check 的 changelog markdown
  string latest_version = 11;
  string checked_at = 12; // RFC3339
  string backup_dir = 13; // 本次更新備份目錄
  bool busy = 14; // 更新鏈進行中（apply 單飛互斥）
  repeated ReleaseNoteEntry history = 15; // 歷史版本 changelog（manifest 權威源）
  bool backup_ready = 16;                 // 備份工具就緒（缺 pg_dump/mysqldump 時 false）
  string backup_hint = 17;                // 缺失時的事前安裝指引
  string prev_version = 18;               // 上一次版本（最近一次更新的起點，持久保存）
  bool docker_update_ready = 19;
  string docker_update_hint = 20;
  bool rollback_ready = 21;
}

message UpdateCheckResult {
  string current_version = 1;
  string latest_version = 2;
  bool has_update = 3;
  string notes = 4;
  string channel = 5;
  string source = 6;
  repeated ReleaseNoteEntry history = 7; // 歷史版本 changelog
}
