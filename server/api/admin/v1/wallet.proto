syntax = "proto3";

package zcard.api.admin.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/admin/v1;adminv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// AdminWalletService 錢包管理：調賬/充值單/流水查詢。
//
// 路由註冊順序注意：protoc-gen-go-http 按方法聲明順序註冊路由，而
// gorilla/mux 按註冊順序匹配（先註冊先命中），因此所有靜態路徑方法必須
// 聲明在含 {user_id} 通配段的方法之前，否則 /wallet/withdrawals 等會被
// /wallet/{user_id} 吞掉並誤解析為 CODEC 400。
service AdminWalletService {
  // ListWithdrawals 提現單列表（狀態篩選）。
  rpc ListWithdrawals(ListWithdrawalsRequest) returns (ListWithdrawalsReply) {
    option (google.api.http) = { get: "/api/v1/admin/wallet/withdrawals" };
  }
  // ReviewWithdrawal 審核（通過→approved 保持鎖定；駁回→rejected 解鎖回餘額）。
  rpc ReviewWithdrawal(ReviewWithdrawalRequest) returns (WithdrawalItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/wallet/withdrawals/{id}/review"
      body: "*"
    };
  }
  // PayWithdrawal 打款（人工打款模式：approved→paid + locked 扣減 + 流水）。
  rpc PayWithdrawal(PayWithdrawalRequest) returns (WithdrawalItem) {
    option (google.api.http) = {
      post: "/api/v1/admin/wallet/withdrawals/{id}/pay"
      body: "*"
    };
  }
  // CreateGiftcardBatch 禮品卡批次創建（批量生成密文 code；giftcard:write）。
  rpc CreateGiftcardBatch(CreateGiftcardBatchRequest) returns (CreateGiftcardBatchReply) {
    option (google.api.http) = {
      post: "/api/v1/admin/wallet/giftcard-batches"
      body: "*"
    };
  }
  // ListGiftcardBatches 批次列表。
  rpc ListGiftcardBatches(ListGiftcardBatchesRequest) returns (ListGiftcardBatchesReply) {
    option (google.api.http) = { get: "/api/v1/admin/wallet/giftcard-batches" };
  }
  // DeleteGiftcardBatch 刪除批次並作廢未兑換卡，保留已兑換記錄。
  rpc DeleteGiftcardBatch(DeleteGiftcardBatchRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/wallet/giftcard-batches/{id}" };
  }
  // GetBalance 指定用户餘額。
  rpc GetBalance(GetBalanceRequest) returns (Balance) {
    option (google.api.http) = { get: "/api/v1/admin/wallet/{user_id}" };
  }
  // Adjust 手動調賬（需 wallet:adjust 權限 + 原因必填 + 審計）。
  rpc Adjust(AdjustRequest) returns (Balance) {
    option (google.api.http) = {
      post: "/api/v1/admin/wallet/{user_id}/adjust"
      body: "*"
    };
  }
  // AdjustPoints 積分調整（正=增加 負=扣減；複用積分賬本與審計）。
  rpc AdjustPoints(AdjustPointsRequest) returns (PointsBalance) {
    option (google.api.http) = {
      post: "/api/v1/admin/wallet/{user_id}/adjust-points"
      body: "*"
    };
  }
  // ListTransactions 指定用户流水。
  rpc ListTransactions(ListWalletTxRequest) returns (ListWalletTxReply) {
    option (google.api.http) = { get: "/api/v1/admin/wallet/{user_id}/transactions" };
  }
}

message DeleteGiftcardBatchRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateGiftcardBatchRequest {
  string batch_no = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  int64 amount_cents = 3 [(google.api.field_behavior) = REQUIRED];
  int32 quantity = 4 [(google.api.field_behavior) = REQUIRED];
}

// CreateGiftcardBatchReply 批次 + 明文碼（僅創建響應一次性返回；此後任何端點
// 不可再取——庫內無明文，鐵律 11；同 一次性明文交付紀律）。
message CreateGiftcardBatchReply {
  GiftcardBatchItem batch = 1;
  repeated string codes = 2; // 明文兑換碼（當次響應後僅存於管理員側）
}

message GiftcardBatchItem {
  uint64 id = 1;
  string batch_no = 2;
  string name = 3;
  int64 amount_cents = 4;
  int32 quantity = 5;
  int64 created_at = 6;
}

message ListGiftcardBatchesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListGiftcardBatchesReply {
  repeated GiftcardBatchItem batches = 1;
  int64 total = 2;
}

message ListWithdrawalsRequest {
  string status = 1; // pending | approved | paid | rejected
  int32 page = 2;
  int32 page_size = 3;
}

message ListWithdrawalsReply {
  repeated WithdrawalItem withdrawals = 1;
  int64 total = 2;
}

message WithdrawalItem {
  uint64 id = 1;
  uint64 user_id = 2;
  string username = 12; // 用户名（列表富化）
  int64 amount_cents = 3;
  int64 fee_cents = 4;
  string method_type = 5;
  string method_name = 13; // 收款方式顯示名
  string account = 6;
  string qr_code_url = 14; // 收款碼圖片（微信/支付寶；審核展示）
  string status = 7; // pending | approved | paid | rejected
  string reject_reason = 8;
  int64 reviewed_at = 9;
  int64 paid_at = 10;
  int64 created_at = 11;
  string receipt = 15; // 打款回執（流水號/備註）
}

message ReviewWithdrawalRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  bool approve = 2;
  string reason = 3; // 駁回必填
}

message PayWithdrawalRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  string receipt = 2; // 打款回執（交易流水號/憑證備註；客户可見）
}

message GetBalanceRequest {
  uint64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message Balance {
  uint64 user_id = 1;
  int64 available_cents = 2;
  int64 locked_cents = 3;
  int64 total_cents = 4;
}

message AdjustRequest {
  uint64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 amount_cents = 2 [(google.api.field_behavior) = REQUIRED]; // 正=入賬 負=扣減
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
}

message AdjustPointsRequest {
  uint64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  int64 points = 2 [(google.api.field_behavior) = REQUIRED]; // 正=增加 負=扣減
  string reason = 3 [(google.api.field_behavior) = REQUIRED];
}

message PointsBalance {
  uint64 user_id = 1;
  int64 points = 2;
}

message ListWalletTxRequest {
  // 指定用户流水；0 = 全站流水（賬單管理）。不能標 REQUIRED——proto3 零值 0 會被網關判缺失。
  uint64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListWalletTxReply {
  repeated WalletTx transactions = 1;
  int64 total = 2;
}

message WalletTx {
  uint64 id = 1;
  string direction = 2;
  string type = 3;
  int64 amount_cents = 4;
  int64 balance_before_cents = 5;
  int64 balance_after_cents = 6;
  string reference = 7;
  string remark = 8;
  int64 created_at = 9;
  uint64 user_id = 10; // 歸屬用户（全站流水場景展示）
  string username = 11; // 歸屬用户名（全站流水批量回填，可空）
  string display_reference = 12; // 展示用業務單號，reference 保留原始冪等鍵
}
