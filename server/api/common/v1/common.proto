syntax = "proto3";

package zcard.api.common.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/common/v1;commonv1";

import "google/protobuf/duration.proto";

// Money 全倉統一金額表示（鐵律 1）：amount 永遠是基礎貨幣的「分」（int64），
// currency 為 ISO 4217 三字碼。展示貨幣換算只發生在展示層與下單快照。
message Money {
  int64 amount = 1; // 分（基礎貨幣，默認 CNY）
  string currency = 2; // CNY / USD / USDT ...
}

// PageReq 分頁請求（後台列表默認按 created_at 倒序；深分頁走遊標，報表除外）。
message PageReq {
  int32 page = 1; // 從 1 起
  int32 page_size = 2; // 默認 20，上限 100
}

// PageResp 分頁響應。
message PageResp {
  int64 total = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// TimeRange 時間範圍（今日/7天/30天/自定義，規劃)。
message TimeRange {
  int64 start = 1; // unix 秒（含）
  int64 end = 2; // unix 秒（含）
}
