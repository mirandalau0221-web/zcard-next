                                $ref: '#/components/schemas/zcard.api.supply.v1.CreateSupplyOrderReply'
    /api/supply/orders/{id}:
        get:
            tags:
                - SupplyService
            description: GetOrder 訂單查詢（輪詢/巡檢兜底）。
            operationId: SupplyService_GetOrder
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.supply.v1.GetSupplyOrderReply'
    /api/supply/orders/{id}/cancel:
        post:
            tags:
                - SupplyService
            description: CancelOrder 取消（未交付訂單釋放鎖卡）。
            operationId: SupplyService_CancelOrder
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.supply.v1.CancelSupplyOrderReply'
    /api/supply/orders/{id}/refund:
        post:
            tags:
                - SupplyService
            description: RefundOrder 退款（已交付轉人工；未交付釋放）。
            operationId: SupplyService_RefundOrder
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.supply.v1.RefundSupplyOrderReply'
    /api/supply/ping:
        get:
            tags:
                - SupplyService
            description: Ping 連通性與協議版本探測（免簽名）。
            operationId: SupplyService_Ping
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
