        get:
            tags:
                - SupplyService
            description: ListProducts 商品列表（分頁；include_inactive 回聲字段防舊版誤判）。
            operationId: SupplyService_ListProducts
            parameters:
                - name: page
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: pageSize
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: includeInactive
                  in: query
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/zcard.api.supply.v1.ListProductsReply'
    /api/supply/products/{id}:
        get:
            tags:
                - SupplyService
            description: GetProduct 商品詳情。
            operationId: SupplyService_GetProduct
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
