tags:
    - name: AdminAuditService
      description: AdminAuditService 審計與風控管理：三類日誌查詢、黑名單管理。
    - name: AdminAuthService
      description: |-
        AdminAuthService 管理後台認證（admin realm JWT，雙 realm 防提權串用）。
         登錄 / 登出 / 當前身份（含權限點，供前端動態路由）。
    - name: AdminCatalogService
      description: AdminCatalogService 商品目錄管理：商品/分類/標籤/控件/商品組/評價。
    - name: AdminContentService
      description: |-
        AdminContentService 內容管理：橫幅/文章/分類 CRUD。
         content_json 入庫前經 sanitize（與商品描述同一策略）；slug 唯一。
    - name: AdminCouponService
      description: AdminCouponService 優惠券管理(基礎版：批量生成/列表/作廢）。
    - name: AdminCurrencyService
      description: AdminCurrencyService 貨幣管理（；多幣種展示，記賬永遠基礎貨幣）。
    - name: AdminDashboardService
      description: AdminDashboardService 工作台指標(v1）。
    - name: AdminFulfillmentService
      description: AdminFulfillmentService 履約管理：待發貨列表 + 手動交付。
    - name: AdminInstallService
      description: |-
        AdminInstallService 在線安裝（Public——僅未安裝時可用；已安裝後 status 只讀、install 拒絕）。
         部署形態：SQLite 零依賴起步（無需數據庫/Redis 配置），瀏覽器打開 → 設管理員 → 完成。
         數據庫/Redis 屬部署層配置（config.yaml / env），不進安裝嚮導。
    - name: AdminInventoryService
      description: AdminInventoryService 卡密庫存管理：導入/導出/列表/操作。
    - name: AdminLicenseService
      description: |-
        AdminLicenseService 訂閲許可證管理：安裝/查詢/清除。
         校驗引擎 ed25519 簽名 + 實例 ID/域名綁定 + 到期（fail-closed）。
    - name: AdminLotteryService
    - name: AdminMediaService
      description: |-
        AdminMediaService 素材庫管理：分類/上傳/列表/改名/移動/批量刪除
         （ref_count>0 需 confirm）/外鏈導入/複製鏈接。
         上傳走 base64（10MB 圖 ~13.7MB JSON；管理面可接受，走統一中間件棧）。
    - name: AdminMemberLevelService
      description: AdminMemberLevelService 會員等級管理。
    - name: AdminNotifyService
      description: AdminNotifyService 通知管理：模板 CRUD/測試發送、發送日誌查詢/重發。
    - name: AdminOrderService
      description: AdminOrderService 訂單管理。
    - name: AdminPaymentService
      description: AdminPaymentService 支付管理：渠道 CRUD + 支付單 + 退款。
    - name: AdminProcurementService
      description: AdminProcurementService 採購管理：採購單列表/詳情/手動重試/手動標記完成。
    - name: AdminResellerService
      description: |-
        AdminResellerService 分站管理(主站面核心）：申請審核/列表/定價/賬本/餘額。
         域名驗證與分站後台完整面隨 storefront 用户登錄體系接續（核心引擎已就緒）。
    - name: AdminSettingsService
      description: |-
        AdminSettingsService 設置中心（settings 表 = 運行時業務開關真理源，鐵律 7）。
         讀寫 API；起補齊安裝嚮導狀態與分組目錄。
    - name: AdminSupplierService
      description: |-
        AdminSupplierService 對外供貨管理：下游賬户申請/審核/啓停/重置密鑰、
         供貨定價 CRUD、賬本流水、回調記錄查詢與手動重發。
    - name: AdminSupplyService
      description: |-
        AdminSupplyService 貨源連接管理：上游連接 CRUD + Ping 探活、
         商品映射規則、同步任務（創建/列表/詳情/取消）、連接健康。
         憑據紀律：credentials 僅創建時明文傳入，任何響應都不回顯密文
         （列表/詳情只給 credentials_set 布爾，鐵律 11）。
    - name: AdminTicketService
      description: |-
        AdminTicketService 客服工單工作台：urgent_paid 置頂持續高亮、
         認領/回覆/內部備註/解決/關閉、篩選。
    - name: AdminUpdateService
      description: |-
        AdminUpdateService 在線更新（doc/在線更新方案.md ；system:update 超管專屬）。
         更新鏈：備份 DB → 落盤下載（流式哈希+進度）→ 原子替換 → 重啓三分支；
         重啓後本接口隨新進程復活——前端輪詢 status 直到 current==target 即成功。
    - name: AdminUserManageService
      description: |-
        AdminUserManageService 前台用户管理（storefront 註冊用户；員工管理見
         AdminUserService——兩者數據域獨立，勿混）。
    - name: AdminUserService
      description: AdminUserService 員工管理（數據層歸 identity，API 面在此；）。
    - name: AdminWalletService
      description: |-
        AdminWalletService 錢包管理：調賬/充值單/流水查詢。

         路由註冊順序注意：protoc-gen-go-http 按方法聲明順序註冊路由，而
         gorilla/mux 按註冊順序匹配（先註冊先命中），因此所有靜態路徑方法必須
         聲明在含 {user_id} 通配段的方法之前，否則 /wallet/withdrawals 等會被
         /wallet/{user_id} 吞掉並誤解析為 CODEC 400。
    - name: RoleService
      description: |-
        RoleService 角色與權限管理（自建 RBAC，規劃 ；）。
         權限目錄由模塊聲明式生成（authz.Declare），本服務只讀下發供前端勾選與動態路由。
    - name: StoreAffiliateService
      description: StoreAffiliateService 我的分銷：推廣碼/團隊/佣金流水/統計。
    - name: StoreCaptchaService
      description: StoreCaptchaService 圖形驗證碼（免鑑權；settings.security.captcha_* 控制場景和格式）。
    - name: StoreCartService
      description: |-
        StoreCartService 購物車(銷賬）：登錄態專屬 CRUD；
         結算複用 StoreOrderService.CreateOrder（多商品一單支付，零下單改動）。
    - name: StoreCatalogService
      description: |-
        StoreCatalogService 顧客前台商品目錄（遊客可訪問；隱藏商品對遊客 404，規劃)。
         ； 骨架先打通「租户上下文 → Ent 查詢 → 薄 service」鏈路。
    - name: StoreContentService
      description: |-
        StoreContentService 前台內容：橫幅（生效時間窗）、文章（公告/博客）、分類。
         多語言字段按請求語言回落（zh_CN 默認）。
    - name: StoreCouponService
      description: StoreCouponService 前台營銷：我的券/兑換碼領券/秒殺營銷位。
    - name: StoreDeliveryService
      description: StoreDeliveryService 顧客取貨(三重門：單號+密碼+限流）。
    - name: StoreLicenseService
      description: |-
        StoreLicenseService 專業套餐在線購買(：發行側部署配置簽發私鑰後開放；
         支付 = 錢包餘額扣款（充值管線入賬的錢），簽發與扣款同事務；購買人下載許可證
         文件後在目標實例後台安裝激活）。
    - name: StoreLotteryService
    - name: StoreMediaService
      description: StoreMediaService 前台媒體（登錄態；收款碼上傳——複用 media 安全三件套）。
    - name: StoreMemberLevelService
      description: StoreMemberLevelService 會員等級(：等級進度 + 積分產生）。
    - name: StoreNotificationService
      description: StoreNotificationService 站內信鈴鐺：未讀數/列表/已讀。
    - name: StoreOrderService
      description: StoreOrderService 顧客下單。
    - name: StorePaymentService
      description: StorePaymentService 顧客支付。
    - name: StoreReviewService
    - name: StoreSMSChannelService
    - name: StoreSMSService
    - name: StoreSocialOrderService
    - name: StoreSocialProductService
      description: Retail endpoints always derive the buyer from the authenticated user realm.
    - name: StoreSupplierService
      description: |-
        StoreSupplierService 前台對接申請（個人中心）：申請成為供貨商户 →
         後台審核 → 憑據管理（app_id + api_secret）。
         通過後憑據可直接填入 acg-faka/dujiao-next/zcard 三面板（協議由申請時選定）。
    - name: StoreTicketService
      description: |-
        StoreTicketService 用户工單：創建/列表/詳情/回覆/評價/付費加急。
         遊客可創建（guest_contact 必填）；內部備註用户側自動過濾。
    - name: StoreUserService
      description: |-
        StoreUserService 用户中心(前置）：註冊/登錄（user realm JWT）/我的信息。
         註冊可帶邀請碼（ref=<user_id>）——三級分銷歸因鏈寫入（環狀拒絕）。
    - name: StoreWalletService
      description: StoreWalletService 顧客錢包：餘額/積分/流水/充值。
    - name: StorefrontConfigService
      description: |-
        StorefrontConfigService 前台公開配置。
         輸出經 PUBLIC_KEYS 白名單過濾（SECRET 鍵絕不外泄——快照測試守護）；
         storefront 前端模板參數、交易開關、啓用語言/貨幣由此驅動。
    - name: SupplyService
      description: |-
        SupplyService 對外供貨 API（本站作上游，ZCard Supply v2 協議）。
         里程碑 完整落地：HMAC 四頭鑑權（X-Supply-Key/Timestamp/Nonce/Signature）、
         ±300s 時間窗、Nonce 防重放、按 key 限流（規劃)。
         Ping 免簽名（連通性探測）；其餘端點全部需要簽名。
         金額口徑：一律「分」（int64）——與 zcard 適配器對偶。
