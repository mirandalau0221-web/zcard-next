components:
    schemas:
        zcard.api.admin.v1.AddSiteRequest:
            required:
                - domain
            type: object
            properties:
                domain:
                    type: string
                siteName:
                    type: string
                isPrimary:
                    type: boolean
        zcard.api.admin.v1.AdjustPointsRequest:
            required:
                - userId
                - points
                - reason
            type: object
            properties:
                userId:
                    type: string
                points:
                    type: string
                reason:
                    type: string
        zcard.api.admin.v1.AdjustRequest:
            required:
                - userId
                - amountCents
                - reason
            type: object
            properties:
                userId:
                    type: string
                amountCents:
                    type: string
                reason:
                    type: string
        zcard.api.admin.v1.Admin:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
                nickname:
                    type: string
                avatar:
                    type: string
                roleId:
                    type: string
                roleName:
                    type: string
                enabled:
                    type: boolean
                totpEnabled:
                    type: boolean
                remark:
                    type: string
            description: Admin 員工（不含密碼哈希等敏感字段）。
        zcard.api.admin.v1.AdminCommission:
            type: object
            properties:
                id:
                    type: string
                orderId:
                    type: string
                buyerId:
                    type: string
                referrerId:
                    type: string
                tier:
                    type: integer
                    format: int32
                rate:
                    type: number
                    format: double
                baseAmount:
                    type: string
                amount:
                    type: string
                status:
                    type: string
                availableAt:
                    type: string
                createdAt:
                    type: string
        zcard.api.admin.v1.AdminControl:
            type: object
            properties:
                placeholder:
                    type: string
                validation:
                    type: string
                maxLength:
                    type: integer
                    format: int32
                id:
                    type: string
                productId:
                    type: string
                name:
                    type: string
                type:
                    type: string
                required:
                    type: boolean
                options:
                    type: array
                    items:
                        type: string
                sort:
                    type: integer
                    format: int32
        zcard.api.admin.v1.AdminOrder:
            type: object
            properties:
                shippingStatus:
                    type: string
                shippingCents:
                    type: string
                shippingAddress:
                    type: object
                    additionalProperties:
                        type: string
                shipmentsJson:
                    type: string
                commerceVersion:
                    type: integer
                    format: int32
                paidTotalCents:
                    type: string
                paidFeeCents:
                    type: string
                refundedFeeCents:
                    type: string
                refundedCents:
                    type: string
                id:
                    type: string
                orderNo:
                    type: string
                status:
                    type: string
                totalCents:
                    type: string
                costCents:
                    type: string
                userId:
                    type: string
                guestContact:
                    type: string
                contact:
                    type: string
                clientIp:
                    type: string
                createdAt:
                    type: string
                paidAt:
                    type: string
                expiredAt:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.AdminOrderItem'
                amountLines:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.AmountLine'
                statusEvents:
                    type: array
                    items:
                        $ref: '#/components/schemas/zcard.api.admin.v1.StatusEvent'
                expiryRetryAt:
                    type: string
                expiryAttempts:
                    type: integer
                    format: int32
                expiryReview:
                    type: boolean
                expiryReason:
                    type: string
            description: AdminOrder 管理面訂單（含成本；StripCostPrice 由 service 判權限）。
        zcard.api.admin.v1.AdminOrderItem:
            type: object
            properties:
                shippingCollect:
                    type: boolean
                goodsType:
                    type: string
                paidCents:
                    type: string
                shippingCents:
                    type: string
                refundedCents:
                    type: string
                refundedShippingCents:
                    type: string
                canceledQuantity:
                    type: integer
