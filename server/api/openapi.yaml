                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/zcard.api.admin.v1.UpdateAdminRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
