syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// StoreAffiliateService 我的分銷：推廣碼/團隊/佣金流水/統計。
service StoreAffiliateService {
  // MyAffiliate 推廣碼 + 統計（登錄用户）。
  rpc MyAffiliate(google.protobuf.Empty) returns (MyAffiliateReply) {
    option (google.api.http) = { get: "/api/v1/storefront/affiliate/me" };
  }
  // ListTeam 下級列表（脱敏用户名）。
  rpc ListTeam(ListTeamRequest) returns (ListTeamReply) {
    option (google.api.http) = { get: "/api/v1/storefront/affiliate/team" };
  }
  // ListCommissions 佣金流水（正 + 負債行）。
  rpc ListCommissions(ListMyCommissionsRequest) returns (ListMyCommissionsReply) {
    option (google.api.http) = { get: "/api/v1/storefront/affiliate/commissions" };
  }
}

message MyAffiliateReply {
  uint64 user_id = 1; // 推廣碼 = user_id
  string invite_url = 2; // 邀請鏈接（?ref=）
  int64 pending_cents = 3; // 凍結中
  int64 available_cents = 4; // 可提
  int64 withdrawn_cents = 5; // 已提現
  int64 total_cents = 6; // 累計
  int64 debt_cents = 7; // 負債
  int64 team_l1 = 8; // 直推人數
  int64 team_l2 = 9;
  int64 team_l3 = 10;
  string promo_code = 11; // 推廣碼（8 位隨機）
}

message ListTeamRequest {
  int32 tier = 1; // 1|2|3；空=全部
  int32 page = 2;
  int32 page_size = 3;
}

message TeamMember {
  uint64 user_id = 1;
  string username_masked = 2; // 脱敏（a***z）
  int32 tier = 3;
  int64 joined_at = 4;
}

message ListTeamReply {
  repeated TeamMember members = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMyCommissionsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message CommissionItem {
  uint64 id = 1;
  uint64 order_id = 2;
  int32 tier = 3;
  int64 base_amount = 4;
  int64 amount = 5; // 負數 = 負債行
  string status = 6; // pending_confirm | available | withdrawn | reversed
  int64 available_at = 7;
  int64 created_at = 8;
}

message ListMyCommissionsReply {
  repeated CommissionItem commissions = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
