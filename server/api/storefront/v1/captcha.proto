syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// StoreCaptchaService 圖形驗證碼（免鑑權；settings.security.captcha_* 控制場景和格式）。
service StoreCaptchaService {
  // GetImage 生成驗證碼和本次輸入格式（一次性消費）。
  rpc GetImage(google.protobuf.Empty) returns (CaptchaImage) {
    option (google.api.http) = { get: "/api/v1/storefront/captcha/image" };
  }
}

message CaptchaImage {
  string captcha_id = 1; // 驗證碼 ID（提交時回傳）
  string image_base64 = 2; // 圖片 data URL（<img src> 直用）
  uint32 length = 3; // 本次驗證碼位數（4–8）
  string charset = 4; // 本次字符類型：digit / letter / mixed（字母不區分大小寫）
}
