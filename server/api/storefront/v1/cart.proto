syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "storefront/v1/catalog.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreCartService 購物車(銷賬）：登錄態專屬 CRUD；
// 結算複用 StoreOrderService.CreateOrder（多商品一單支付，零下單改動）。
service StoreCartService {
  // AddCartItem 加購（同 user+product+sku 合併數量；商品須上架）。
  rpc AddCartItem(AddCartItemRequest) returns (CartItem) {
    option (google.api.http) = {
      post: "/api/v1/storefront/cart/items"
      body: "*"
    };
  }
  // ListCart 我的購物車（商品快照聯查；失效商品打標）。
  rpc ListCart(google.protobuf.Empty) returns (ListCartReply) {
    option (google.api.http) = { get: "/api/v1/storefront/cart" };
  }
  // UpdateCartItem 改量（quantity=0 即刪除）。
  rpc UpdateCartItem(UpdateCartItemRequest) returns (CartItem) {
    option (google.api.http) = {
      post: "/api/v1/storefront/cart/items/{id}"
      body: "*"
    };
  }
  // RemoveCartItem 移除。
  rpc RemoveCartItem(RemoveCartItemRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/api/v1/storefront/cart/items/{id}"
    };
  }
}

message AddCartItemRequest {
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 sku_id = 2; // 0=默認規格
  int32 quantity = 3 [(google.api.field_behavior) = REQUIRED]; // 1-99
}

message UpdateCartItemRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
  int32 quantity = 2 [(google.api.field_behavior) = REQUIRED];
}

message RemoveCartItemRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

message CartItem {
  uint64 id = 1;
  uint64 product_id = 2;
  uint64 sku_id = 3;
  int32 quantity = 4;
  // 商品快照（聯查現值——結算前端展示用）
  string product_name = 5;
  int64 price_cents = 6; // 現價（SKU 解析後）
  int32 max_quantity = 14; // 單次購買上限，0 使用默認上限
  int64 stock = 7; // 可用庫存（-1 不限）
  bool points_only = 8; // 積分兑換商品（不可混合結算）
  int64 points_required = 9;
  bool valid = 10; // false=已下架/隱藏（列表打標不可選）
  FlashOffer flash_sale = 13;
  int64 added_at = 11;
  string product_cover = 12; // 商品封面（無圖時前端顯示默認佔位）
}

message ListCartReply {
  repeated CartItem items = 1;
  int32 total = 2; // 有效項數
}
