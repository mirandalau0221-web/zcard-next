syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "common/v1/common.proto";

// StoreCatalogService 顧客前台商品目錄（遊客可訪問；隱藏商品對遊客 404，規劃)。
// ； 骨架先打通「租户上下文 → Ent 查詢 → 薄 service」鏈路。
service StoreCatalogService {
  // ListProducts 商品列表（上架 + 按排序；庫存數用於購買校驗，stock_visible 僅控制展示）。
  rpc ListProducts(ListProductsRequest) returns (ListProductsReply) {
    option (google.api.http) = {
      get: "/api/v1/storefront/products"
    };
  }
  // GetProduct 商品詳情（下架/隱藏商品返回 NOT_FOUND）。
  rpc GetProduct(GetProductRequest) returns (Product) {
    option (google.api.http) = {
      get: "/api/v1/storefront/products/{id}"
    };
  }
  // ListCategories 可見分類列表（hide=false + 分站白名單；導航/篩選用）。
  rpc ListCategories(google.protobuf.Empty) returns (ListCategoriesReply) {
    option (google.api.http) = {
      get: "/api/v1/storefront/categories"
    };
  }
}

message ListCategoriesReply {
  repeated CategoryItem categories = 1;
}

message CategoryItem {
  uint64 id = 1;
  string name = 2;
  string icon = 3;
  uint64 parent_id = 4; // 父分類（0=根；多級分類樹形）
}

message ListProductsRequest {
  // 分類過濾（可選）
  uint64 category_id = 1;
  // 搜索關鍵詞（可選，僅商品名等值/前綴匹配；全文搜索 走外置）
  string keyword = 2;
  // 扁平分頁（query 綁定：?page=1&page_size=20）
  int32 page = 3;
  int32 page_size = 4;
  // 積分商城視圖（true=僅積分兑換商品 points_required>0；）
  bool points_only = 5;
  // 排序：newest（默認）| price_asc | price_desc | sales
  string sort = 6;
  // 推薦位視圖（true=僅運營推薦商品 is_recommend；首頁「推薦商品」區塊）
  bool recommend_only = 7;
}

message ListProductsReply {
  repeated Product items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetProductRequest {
  uint64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Product 顧客視角商品（管理字段與成本價絕不下發）。
message FlashOffer {
  int64 price_cents = 1;
  int64 end_at = 2;
  int32 remaining = 3;
  int32 per_user_limit = 4;
}

message Product {
  string product_property = 71;
  optional bool track_inventory = 72;
  optional bool sales_visible = 73;
 string product_kind = 70;
 string delivery_kind = 60;
 map<string,string> sms_product = 61;
 bool sms_sales_enabled = 62;
  string goods_type = 50;
  string shipping_mode = 51;
  int64 shipping_fee_cents = 52;
  repeated string shipping_countries = 53;
  int64 physical_stock = 54;
  string fulfillment_mode = 21;
  int64 manual_stock = 22;
  uint64 id = 1;
  string name = 2;
  string slug = 3;
  string description = 4; // 已 sanitize 的 Markdown/HTML
  string cover = 5;
  // 售價（分，基礎貨幣）
  int64 price_cents = 6;
  // 庫存類型 card/url/code
  string stock_type = 7;
  // 按貨源返回庫存（>=0 數量，-1 不限，-2 待確認），stock_visible 僅控制展示
  int64 stock = 8;
  // 庫存是否對外可見
  optional bool stock_visible = 9;
  uint64 category_id = 10;
  // 展示銷量 = 真實 + 虛擬
  int64 sales_count = 11;
  // 自定義控件（下單收集：文本/密碼/下拉/數字/多選/單選）
  repeated ProductControl controls = 12;
  // 評價（真實 approved + 虛擬合併，按時間/排序）
  repeated ReviewItem reviews = 13;
  // 多規格 SKU（下單可選；Sku.price_cents > 商品價時下單按 SKU 價）
  repeated Sku skus = 14;
  // 積分兑換價（0=常規商品；>0=積分商城商品，下單走積分兑換分支；）
  int64 points_required = 15;
  // 運營推薦（首頁推薦位標記）
  bool is_recommend = 16;
  string stock_status = 17; // current | stale | unknown
  int64 stock_reference = 18; // 僅供展示的上次庫存，不作為購買校驗依據
  int64 stock_checked_at = 19; // 上次庫存查詢時間
  FlashOffer flash_sale = 20;
  bool category_recommend = 23;
  bool category_pinned = 24;
  google.protobuf.Struct social_schema = 55;

}

// ProductControl 自定義控件定義（下單表單渲染）。
message ProductControl {
  string placeholder = 7;
  string validation = 8;
  int32 max_length = 9;
  uint64 id = 1;
  string name = 2;
  string type = 3; // text | password | select | number | checkbox | radio
  bool required = 4;
  repeated string options = 5; // select/checkbox/radio 的選項
  int32 sort = 6;
}

// ReviewItem 顧客視角評價（真實 approved + 虛擬合併）。
message ReviewItem {
  uint64 id = 1;
  string nickname = 2;
  string content = 3;
  int32 rating = 4;
  int64 created_at = 5;
  bool is_virtual = 6;
}

// Sku 顧客視角多規格（只下發 id/名稱/價格）。
message Sku {
 int64 stock = 6;
  string fulfillment_mode = 5;
  uint64 id = 1;
  string name = 2;
  int64 price_cents = 3;
  FlashOffer flash_sale = 4;
}
