syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// StorefrontConfigService 前台公開配置。
// 輸出經 PUBLIC_KEYS 白名單過濾（SECRET 鍵絕不外泄——快照測試守護）；
// storefront 前端模板參數、交易開關、啓用語言/貨幣由此驅動。
service StorefrontConfigService {
  // GetPublicConfig 前台公開配置（全部分組白名單鍵合併下發，穩定排序）。
  rpc GetPublicConfig(google.protobuf.Empty) returns (PublicConfig) {
    option (google.api.http) = { get: "/api/v1/storefront/config" };
  }
  // ListCurrencies 啓用貨幣列表（展示換算用）。
  rpc ListCurrencies(google.protobuf.Empty) returns (Currencies) {
    option (google.api.http) = { get: "/api/v1/storefront/currencies" };
  }
}

// PublicConfig 公開配置條目列表。
message PublicConfig {
  repeated PublicConfigEntry entries = 1;
}

// PublicConfigEntry 單鍵（key 形如 "site.name"；value 為 JSON 文檔字符串）。
message PublicConfigEntry {
  string key = 1;
  string value_json = 2;
}

// Currencies 貨幣列表。
message Currencies {
  repeated Currency currencies = 1;
}

// Currency 貨幣（rate 為 decimal 字符串——前端 decimal 換算，杜絕浮點誤差入口）。
message Currency {
  string code = 1;
  string symbol = 2;
  string position = 3;
  int32 precision = 4;
  string rate_json = 5;
}
