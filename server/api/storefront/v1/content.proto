syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// StoreContentService 前台內容：橫幅（生效時間窗）、文章（公告/博客）、分類。
// 多語言字段按請求語言回落（zh_CN 默認）。
service StoreContentService {
  // ListBanners 生效中橫幅（position 過濾 + sort 排序 + 時間窗過濾）。
  rpc ListBanners(ListBannersRequest) returns (ListBannersReply) {
    option (google.api.http) = { get: "/api/v1/storefront/banners" };
  }
  // ListPosts 已發佈文章分頁（type 過濾）。
  rpc ListPosts(ListPostsRequest) returns (ListPostsReply) {
    option (google.api.http) = { get: "/api/v1/storefront/posts" };
  }
  // GetPost 文章詳情（slug；未發佈返回 404 語義）。
  rpc GetPost(GetPostRequest) returns (GetPostReply) {
    option (google.api.http) = { get: "/api/v1/storefront/posts/{slug}" };
  }
  // ListPostCategories 分類列表。
  rpc ListPostCategories(ListPostCategoriesRequest) returns (ListPostCategoriesReply) {
    option (google.api.http) = { get: "/api/v1/storefront/post-categories" };
  }
}

message ListBannersRequest {
  string position = 1; // top | middle | bottom；空 = 全部
  string locale = 2; // 空 = zh_CN
}

message StoreBanner {
  uint64 id = 1;
  string title = 2; // 按語言回落後
  string image = 3;
  string mobile_image = 4; // 缺省回落 PC 圖
  string link_type = 5;
  string link_value = 6;
}

message ListBannersReply {
  repeated StoreBanner banners = 1;
}

message ListPostsRequest {
  string type = 1; // blog | notice；空 = 全部
  string locale = 2;
  int32 page = 3;
  int32 page_size = 4;
  uint64 category_id = 5; // 欄目過濾；0 = 全部
}

message StorePost {
  uint64 id = 1;
  string slug = 2;
  string type = 3;
  string title = 4;
  string summary = 5;
  string thumbnail = 6;
  uint64 category_id = 7;
  int64 published_at = 8;
}

message ListPostsReply {
  repeated StorePost posts = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetPostRequest {
  string slug = 1 [(google.api.field_behavior) = REQUIRED];
  string locale = 2;
}

message GetPostReply {
  StorePost post = 1;
  string content = 2; // 按語言回落後（sanitize 後的 HTML）
}

message ListPostCategoriesRequest {}

message StorePostCategory {
  uint64 id = 1;
  string name = 2;
  string slug = 3;
}

message ListPostCategoriesReply {
  repeated StorePostCategory categories = 1;
}
