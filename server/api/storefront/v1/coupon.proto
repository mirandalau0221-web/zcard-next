syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// StoreCouponService 前台營銷：我的券/兑換碼領券/秒殺營銷位。
service StoreCouponService {
  // ListMyCoupons 我的可用券（登錄用户）。
  rpc ListMyCoupons(google.protobuf.Empty) returns (ListMyCouponsReply) {
    option (google.api.http) = { get: "/api/v1/storefront/coupons/mine" };
  }
  // RedeemCoupon 兑換碼領券。
  rpc RedeemCoupon(RedeemCouponRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/storefront/coupons/redeem"
      body: "*"
    };
  }
  // ListFlashSales 秒殺列表（upcoming=false 進行中 / true 即將開始）。
  rpc ListFlashSales(ListFlashSalesRequest) returns (ListFlashSalesReply) {
    option (google.api.http) = { get: "/api/v1/storefront/flash-sales" };
  }
}

import "google/protobuf/empty.proto";

message MyCoupon {
  uint64 id = 1;
  string name = 2;
  string type = 3; // fixed | percent
  int64 value = 4; // fixed=分；percent=萬分比
  string code = 5;
  string scope_json = 6;
  int64 expire_at = 7;
}

message ListMyCouponsReply {
  repeated MyCoupon coupons = 1;
}

message RedeemCouponRequest {
  string code = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListFlashSalesRequest {
  bool upcoming = 1; // true = 即將開始；false = 進行中
}

message StoreFlashSale {
  uint64 id = 1;
  uint64 product_id = 2;
  int64 flash_price = 3; // 分
  int64 start_at = 4;
  int64 end_at = 5;
  int32 remaining = 6; // 剩餘量（limit - sold；-1 未提供）
}

message ListFlashSalesReply {
  repeated StoreFlashSale items = 1;
}
