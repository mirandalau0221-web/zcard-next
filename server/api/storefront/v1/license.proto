syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreLicenseService 專業套餐在線購買(：發行側部署配置簽發私鑰後開放；
// 支付 = 錢包餘額扣款（充值管線入賬的錢），簽發與扣款同事務；購買人下載許可證
// 文件後在目標實例後台安裝激活）。
service StoreLicenseService {
  // GetLicenseOffer 套餐報價（價格服務端裁決；instance_id 供目標實例綁定預覽）。
  rpc GetLicenseOffer(google.protobuf.Empty) returns (LicenseOfferReply) {
    option (google.api.http) = { get: "/api/v1/storefront/license/offer" };
  }
  // PurchaseLicense 購買（錢包扣款 → ed25519 簽發 → 返回許可證文件）。
  rpc PurchaseLicense(PurchaseLicenseRequest) returns (PurchaseLicenseReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/license/purchase"
      body: "*"
    };
  }
  // ListLicenseOrders 購買記錄（含許可證文件可重新下載）。
  rpc ListLicenseOrders(ListLicenseOrdersRequest) returns (ListLicenseOrdersReply) {
    option (google.api.http) = { get: "/api/v1/storefront/license/orders" };
  }
}

// LicenseOfferReply 套餐報價與購買前置狀態。
message LicenseOfferReply {
  // 月付價（分；默認 300 = 3U）
  int64 monthly_cents = 1;
  // 年付價（分；默認 3000 = 30U）
  int64 yearly_cents = 2;
  // 發行側是否配置簽發私鑰（false = 本部署不開通在線購買）
  bool purchasable = 3;
  // 本部署實例 ID（自購場景綁定預覽；購買其他實例時填對方實例 ID）
  string instance_id = 4;
}

message PurchaseLicenseRequest {
  // monthly | yearly
  string plan = 1 [(google.api.field_behavior) = REQUIRED];
  // 目標實例 ID（空 = 綁定本部署實例——發行側自測/內部發行場景）
  string instance_id = 2;
  // 目標域名（可選；空 = 不限域名）
  string domain = 3;
}

message PurchaseLicenseReply {
  uint64 order_id = 1;
  // 許可證文件內容（JSON：license + signature；目標實例後台安裝激活）
  string license_file = 2;
  string expires_at = 3; // RFC3339
  int64 paid_cents = 4;
}

message ListLicenseOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListLicenseOrdersReply {
  repeated LicenseOrderItem orders = 1;
  int64 total = 2;
}

message LicenseOrderItem {
  uint64 id = 1;
  string plan = 2;
  int64 amount_cents = 3;
  string status = 4; // pending | success | canceled
  string instance_id = 5;
  string domain = 6;
  string license_file = 7;
  string expires_at = 8;
  int64 created_at = 9;
}
