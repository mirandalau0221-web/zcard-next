syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

// StoreMemberLevelService 會員等級(：等級進度 + 積分產生）。
service StoreMemberLevelService {
  rpc GetInviteBenefit(InviteBenefitRequest) returns (InviteBenefitReply) {
    option (google.api.http) = { get: "/api/v1/storefront/member-level/invite-benefit" };
  }
  // GetMyLevel 我的等級（當前等級 + 下一等級 + 升級進度 + 積分餘額與產生規則）。
  rpc GetMyLevel(google.protobuf.Empty) returns (MyLevelReply) {
    option (google.api.http) = { get: "/api/v1/storefront/member-level" };
  }
}

// MyLevelReply 等級進度（閾值即時評估口徑：只升不降隨累計值單調）。
message MyLevelReply {
  string source = 8; // manual | referral | auto | none
  bool has_referral_level = 9;
  bool private_level = 10;
  // 累計充值（countAsRecharge 口徑：僅真實充值入賬，互轉/調賬不計）
  int64 recharged_cents = 1;
  // 累計消費（已支付及之後狀態訂單額）
  int64 consumed_cents = 2;
  // 積分餘額
  int64 points = 3;
  // 當前等級（未命中任何等級為 null）
  LevelBrief current = 4;
  // 下一等級（已滿級為 null）
  LevelBrief next = 5;
  // 升級進度（距下一等級差額）
  LevelProgress progress = 6;
  repeated LevelBrief levels = 7; // 啓用的等級及折扣，按升級順序排列
}

// LevelBrief 等級摘要。
message LevelBrief {
  string display_mode = 8;
  string display_text = 9;
  string acquire_mode = 10;
  uint64 id = 1;
  string name = 2;
  int32 discount = 3; // 萬分比折扣
  string threshold_type = 4; // recharge | consume | both_and | both_or
  int64 threshold_recharge = 5; // 升級閾值（分）
  int64 threshold_consume = 6;
  string points_rule_json = 7; // 積分產生規則 {"spend_cents":X,"points":Y}
}

// LevelProgress 距下一等級進度。
message LevelProgress {
  // 充值口徑差額（0 = 已達標；下一等級不含充值條件時為 -1）
  int64 recharge_gap_cents = 1;
  // 消費口徑差額（0 = 已達標；下一等級不含消費條件時為 -1）
  int64 consume_gap_cents = 2;
  // 綜合進度百分比 0-100（按已達標口徑均值粗算；both_and 取較小值）
  int32 percent = 3;
}

message InviteBenefitRequest { string code = 1; }
message InviteBenefitReply { bool valid = 1; bool has_benefit = 2; LevelBrief level = 3; }
