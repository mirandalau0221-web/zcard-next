syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreOrderService 顧客下單。
service StoreOrderService {
  rpc SendOrderAccessCode(OrderAccessCodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/storefront/orders/{order_no}/access-code" body: "*" };
  }
  rpc RecoverOrderAccess(OrderAccessRecoveryRequest) returns (OrderAccessReply) {
    option (google.api.http) = { post: "/api/v1/storefront/orders/{order_no}/access-recover" body: "*" };
  }
 rpc QuoteOrder(CreateOrderRequest) returns (CreateOrderReply) { option (google.api.http) = { post: "/api/v1/storefront/orders/quote" body: "*" }; }
 rpc ShippingRegions(ShippingRegionsRequest) returns (ShippingRegionsReply) { option (google.api.http) = { get: "/api/v1/storefront/shipping/regions" }; }
 rpc ReceiveShipment(ReceiveShipmentRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/api/v1/storefront/orders/{order_no}/receive" body: "*" }; }

  // CreateOrder 下單（鎖卡→算價→快照→事件；Idempotency-Key 頭防重）。
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/orders"
      body: "*"
    };
  }
  // GetOrder 憑單號+查詢密碼查單（三重門之一二：查詢密碼/登錄態本人）。
  rpc GetOrder(GetOrderRequest) returns (GetOrderReply) {
    option (google.api.http) = { get: "/api/v1/storefront/orders/{order_no}" };
  }
  // ListMyOrders 我的訂單（登錄態；offset 分頁）。
  rpc ListMyOrders(ListMyOrdersRequest) returns (ListMyOrdersReply) {
    option (google.api.http) = { get: "/api/v1/storefront/my-orders" };
  }
  // ListGuestOrders 遊客按下單聯繫方式查訂單列表（郵箱/手機號；精簡信息——
  // 卡密仍需逐單查詢密碼，防枚舉：查不到返回空）。
  rpc ListGuestOrders(ListGuestOrdersRequest) returns (ListGuestOrdersReply) {
    option (google.api.http) = { get: "/api/v1/storefront/guest-orders" };
  }
  // CancelMyOrder 取消本人待支付訂單（pending 可取消；鎖卡釋放+返券）。
  rpc CancelMyOrder(CancelMyOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/storefront/orders/{order_no}/cancel"
      body: "*"
    };
  }
}

message CreateOrderRequest {
 string sms_quote_id = 20;

  map<string,string> shipping_address = 11;
  string quote_key = 12;
  repeated OrderItemInput items = 1 [(google.api.field_behavior) = REQUIRED];
  string guest_contact = 2;
  string query_password = 3;
  string contact = 4;
  string coupon_code = 5;
  // 控件答案（key=控件 ID 字符串，value=答案；多選用逗號分隔）
  map<string, string> control_answers = 6;
  // 積分兑換下單（：全部商品須為積分商品；積分同事務扣款，訂單直落 paid）
  bool use_points = 7;
  // 推廣歸因碼（可空）：遊客/無鏈用户下單時實時解析推廣者 → 訂單級歸因快照
  string ref_code = 8;
  // 圖形驗證碼（captcha_order 開啓時遊客必填）
  string captcha_id = 9;
  string captcha_code = 10;
}

message OrderItemInput {
  map<string, string> control_answers = 4;
  uint64 product_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint64 sku_id = 2;
  int32 quantity = 3 [(google.api.field_behavior) = REQUIRED];
}

message CreateOrderReply {
  // At least one item has shipping payable to the carrier on delivery.
  bool shipping_collect = 7;
  string order_access_token = 6;
  int64 shipping_cents = 4;
  string quote_key = 5;
  string order_no = 1;
  int64 total_cents = 2;
  int64 expires_at = 3;
}

message GetOrderRequest {
  string order_access_token = 3;
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  string query_password = 2;
}

message GetOrderReply {
  string shipping_status = 11;
  int64 shipping_cents = 12;
  map<string,string> shipping_address = 13;
  string shipments_json = 14;
  int32 commerce_version = 15;
  int64 refunded_cents = 9;
  int64 refunded_fee_cents = 10;
  string order_no = 1;
  string status = 2;
  int64 total_cents = 3;
  repeated OrderItemReply items = 4;
  int64 created_at = 5;
  int64 expires_at = 6; // 訂單過期時間（倒計時；0=無過期）
  int64 paid_total_cents = 7;
  int64 paid_fee_cents = 8;
}

message OrderItemReply {
  bool shipping_collect = 32;
 string delivery_kind = 30;
 map<string,string> sms_product = 31;
  string goods_type = 11;
  int64 paid_cents = 12;
  int64 shipping_cents = 13;
  int32 shipped_quantity = 14;
  int32 received_quantity = 15;
  int32 canceled_quantity = 16;
  int32 returned_quantity = 17; // 已驗收退回併入庫數量，與已取消數量分別累計
  uint64 id = 5;
  string sku_name = 6;
  string fulfillment_type = 7;
  string fulfillment_status = 8;
  string form_answers_json = 9;
  int64 amount_cents = 10;
  uint64 product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
}

// ── 遊客訂單查詢（聯繫方式 + 密碼取貨閉環）──

message ListGuestOrdersRequest {
  string contact = 1 [(google.api.field_behavior) = REQUIRED]; // 下單時留的郵箱/手機號
}

message ListGuestOrdersReply {
  repeated GuestOrderItem orders = 1;
}

message GuestOrderItem {
  string order_no = 1;
  string status = 2;
  int64 total_cents = 3;
  int64 created_at = 4;
  int64 expires_at = 5;
}

// ── 我的訂單(補全 2026-08-17）──

message ListMyOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  // 狀態篩選（可選：pending_payment/paid/delivered/completed/canceled/expired/refunded）
  string status = 3;
}

message ListMyOrdersReply {
  repeated MyOrderItem orders = 1;
  int64 total = 2;
}

// MyOrderItem 我的訂單行（金額/狀態/時間；卡密取回走 GetOrder）。
message MyOrderItem {
  string shipping_status = 9;
  string order_no = 1;
  string status = 2;
  int64 total_cents = 3;
  int64 created_at = 4;
  int64 expired_at = 5;
  int32 item_count = 6;
  string product_summary = 7;
  int32 manual_pending_count = 8;
}

message CancelMyOrderRequest {
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
}

message ShippingRegionsRequest { string country = 1; }
message ShippingRegionsReply { string data_json = 1; }
message ReceiveShipmentRequest { string order_no = 1; uint64 shipment_id = 2; string query_password = 3; string order_access_token = 4; }

service StoreSMSService {
 rpc ListSMSProduct(SMSProductHistoryRequest) returns(SMSProductHistoryReply){option(google.api.http)={get:"/api/v1/storefront/products/{product_id}/sms/sessions"};}
 rpc GetSMS(SMSOrderRequest) returns (SMSOrderReply) { option (google.api.http) = { get: "/api/v1/storefront/orders/{order_no}/sms" }; }
 rpc ActSMS(SMSActionRequest) returns (SMSOrderReply) { option (google.api.http) = { post: "/api/v1/storefront/orders/{order_no}/sms/{action}" body: "*" }; }
}
message SMSOrderRequest { string order_no = 1; }
message SMSActionRequest { string order_no = 1; string action = 2; string request_id = 3; }
message SMSOrderReply {
 string state = 1; string phase = 2; string phone_number = 3;
 string otp_code = 4; string otp_message = 5; string expires_at = 6;
 string cancel_available_at = 7; bool can_cancel = 8; bool can_finish = 9;
 string operation_status = 10; string operation_action = 11;
 string refund_status = 12; string message = 13; bool active = 14;
 string operation_request_id = 15;
}

message SMSProductHistoryRequest{uint64 product_id=1;int32 page=2;}
message SMSRetailSession{string order_no=1;string offer_name=2;int64 amount_cents=3;SMSOrderReply sms=4;}
message SMSProductHistoryReply{repeated SMSRetailSession orders=1;}

message OrderAccessCodeRequest { string order_no = 1; string email = 2; }
message OrderAccessRecoveryRequest { string order_no = 1; string email = 2; string code = 3; }
message OrderAccessReply { string order_access_token = 1; }
