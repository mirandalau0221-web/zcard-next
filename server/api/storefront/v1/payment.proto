syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";


// StorePaymentService 顧客支付。
service StorePaymentService {
  // ListChannels 啓用渠道列表（支付頁渠道下拉數據源—— 替代前端硬編碼枚舉）。
  rpc ListChannels(ListPaymentChannelsRequest) returns (ChannelListReply) {
    option (google.api.http) = { get: "/api/v1/storefront/payment/channels" };
  }
  rpc QuotePayment(PaymentQuoteRequest) returns (PaymentQuote) {
    option (google.api.http) = { post: "/api/v1/storefront/payment/quote" body: "*" };
  }
  // CreatePayment 創建支付（返回收銀台/二維碼跳轉信息）。
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/payments"
      body: "*"
    };
  }
}

message ListPaymentChannelsRequest {
  string scene = 1; // purchase (default) | member_recharge | supply_recharge
}

// ChannelListReply 啓用渠道列表。
message ChannelListReply {
  repeated ChannelItem channels = 1;
}

message ChannelItem {
  string code = 1;
  string name = 2; // 渠道名稱（管理端配置）
  string driver = 3;
  string icon = 4; // 渠道自定義圖標 URL（空=前端回落內置徽標）
  int64 fee = 6;
  string fee_type = 7;
  string fee_bearer = 8;
  bool recommended = 9;
  string recommend_label = 10;
  string recommend_description = 11;
  repeated MethodItem methods = 5; // 支付方式列表（聚合網關；空=單方式渠道）
}

// MethodItem 支付方式（收銀台顧客看到的選項：支付寶/微信/USDT-TRC20…）。
message MethodItem {
  string code = 1;
  string name = 2;
  bool recommended = 4;
  string recommend_label = 5;
  string recommend_description = 6;
  string icon = 3; // 方式級自定義圖標（空=回落渠道圖標/內置徽標）
}

message CreatePaymentRequest {
  string order_access_token = 6;
  string quote_key = 4;
  string query_password = 5;
  string order_no = 1 [(google.api.field_behavior) = REQUIRED];
  string channel = 2 [(google.api.field_behavior) = REQUIRED];
  string method = 3; // 支付方式 code（多方式渠道必選；單方式渠道可空）
}

message CreatePaymentReply {
  PaymentQuote quote = 4;
  uint64 payment_id = 1;
  string type = 2; // redirect | qrcode | params
  string payload = 3; // URL / 二維碼內容 / 參數 JSON
}

message PaymentQuoteRequest {
  string order_access_token = 7;
  string order_no = 1;
  string channel = 2;
  string method = 3;
  string scene = 4;
  int64 amount_cents = 5;
  string query_password = 6;
}
message PaymentQuote {
  int64 base_cents = 1;
  int64 fee_cents = 2;
  int64 total_cents = 3;
  string fee_type = 4;
  int64 fee_rate = 5;
  string fee_bearer = 6;
  string quote_key = 7;
  uint64 payment_id = 8;
  string channel = 9;
  string method = 10;
  string charged_currency = 11;
  int64 charged_units = 12;
  int32 charged_precision = 13;
}
