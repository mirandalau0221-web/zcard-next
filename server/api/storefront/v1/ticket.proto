syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreTicketService 用户工單：創建/列表/詳情/回覆/評價/付費加急。
// 遊客可創建（guest_contact 必填）；內部備註用户側自動過濾。
service StoreTicketService {
  // CreateTicket 創建工單（登錄用户或遊客）。
  rpc CreateTicket(CreateTicketRequest) returns (Ticket) {
    option (google.api.http) = {
      post: "/api/v1/storefront/tickets"
      body: "*"
    };
  }
  // ListMyTickets 我的工單列表。
  rpc ListMyTickets(ListMyTicketsRequest) returns (ListMyTicketsReply) {
    option (google.api.http) = { get: "/api/v1/storefront/tickets" };
  }
  // GetTicket 工單詳情（消息流；內部備註過濾）。
  rpc GetTicket(GetTicketRequest) returns (GetTicketReply) {
    option (google.api.http) = { get: "/api/v1/storefront/tickets/{ticket_no}" };
  }
  // ReplyTicket 追加回復。
  rpc ReplyTicket(ReplyTicketRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/storefront/tickets/{ticket_no}/reply"
      body: "*"
    };
  }
  // RateTicket 評價（resolved 後 1-5）。
  rpc RateTicket(RateTicketRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/storefront/tickets/{ticket_no}/rate"
      body: "*"
    };
  }
  // PayUrgent 付費加急（餘額支付 urgent_fee；成功即 priority=urgent_paid）。
  rpc PayUrgent(PayUrgentRequest) returns (PayUrgentReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/tickets/{ticket_no}/urgent"
      body: "*"
    };
  }
}

message CreateTicketRequest {
  string type = 1 [(google.api.field_behavior) = REQUIRED]; // presale | aftersale
  string content = 2 [(google.api.field_behavior) = REQUIRED];
  string guest_contact = 3; // 遊客必填（聯繫方式）
  uint64 order_id = 4; // 可選關聯
  uint64 product_id = 5;
  repeated uint64 attachment_media_ids = 6;
}

message Ticket {
  uint64 id = 1;
  string ticket_no = 2;
  string type = 3;
  string priority = 4;
  string status = 5;
  uint64 order_id = 6;
  uint64 product_id = 7;
  int64 first_reply_at = 8;
  int64 sla_due_at = 9;
  int32 satisfaction = 10;
  int64 created_at = 11;
}

message ListMyTicketsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMyTicketsReply {
  repeated Ticket tickets = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetTicketRequest {
  string ticket_no = 1 [(google.api.field_behavior) = REQUIRED];
}

message TicketMessage {
  uint64 id = 1;
  string sender_type = 2; // user | admin | system（內部備註已過濾）
  string content = 3;
  repeated uint64 attachments = 4;
  int64 created_at = 5;
}

message GetTicketReply {
  Ticket ticket = 1;
  repeated TicketMessage messages = 2;
  bool urgent_available = 3;
  int64 urgent_fee_cents = 4;
  string urgent_error = 5;
}

message ReplyTicketRequest {
  string ticket_no = 1 [(google.api.field_behavior) = REQUIRED];
  string content = 2 [(google.api.field_behavior) = REQUIRED];
  repeated uint64 attachment_media_ids = 3;
}

message RateTicketRequest {
  string ticket_no = 1 [(google.api.field_behavior) = REQUIRED];
  int32 rating = 2 [(google.api.field_behavior) = REQUIRED]; // 1-5
}

message PayUrgentRequest {
  string ticket_no = 1 [(google.api.field_behavior) = REQUIRED];
  optional int64 expected_fee_cents = 2; // 用户已確認的報價；缺失或變價拒絕扣費
}

message PayUrgentReply {
  bool paid = 1;
  int64 fee_cents = 2; // 實扣（分）
  string error = 3; // 餘額不足等
  bool already_urgent = 4;
}
