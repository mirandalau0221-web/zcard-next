syntax = "proto3";

package zcard.api.storefront.v1;

option go_package = "github.com/NovaWorks/zcard-next/server/api/storefront/v1;storefrontv1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";

// StoreUserService 用户中心(前置）：註冊/登錄（user realm JWT）/我的信息。
// 註冊可帶邀請碼（ref=<user_id>）——三級分銷歸因鏈寫入（環狀拒絕）。
service StoreUserService {
  // Register 註冊（username+password；invite_code 可選=上級 user_id）。
  rpc Register(RegisterRequest) returns (RegisterReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/register"
      body: "*"
    };
  }
  // SendRegisterCode 發送註冊驗證碼（通道：email|phone——按 security.register_method 校驗）。
  rpc SendRegisterCode(SendRegisterCodeRequest) returns (SendRegisterCodeReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/register/send-code"
      body: "*"
    };
  }
  // Login 登錄（返回 user realm JWT；username 混輸：用户名/郵箱/手機號）。
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/login"
      body: "*"
    };
  }
  // Me 我的信息（需登錄）。
  rpc Me(google.protobuf.Empty) returns (MeReply) {
    option (google.api.http) = { get: "/api/v1/storefront/user/me" };
  }
  // ForgotPassword 發送找回密碼驗證碼（：郵箱不存在同樣成功——防枚舉）。
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/password/forgot"
      body: "*"
    };
  }
  // ResetPassword 驗碼重置密碼（重置即登錄——返回新 token；吊銷全部 session）。
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/password/reset"
      body: "*"
    };
  }
  // ChangePassword 登錄態改密（舊密碼校驗；吊銷全部 session、響應攜帶新 token 保當前會話）。
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/password/change"
      body: "*"
    };
  }
  // UpdateProfile 修改資料（郵箱；唯一性校驗）。
  rpc UpdateProfile(UpdateProfileRequest) returns (MeReply) {
    option (google.api.http) = {
      post: "/api/v1/storefront/user/profile"
      body: "*"
    };
  }
}

message RegisterRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED];
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  string email = 3;
  string invite_code = 4; // 推廣碼（8 位隨機或舊數字 ID；可空）
  string code = 5; // 註冊驗證碼（register_method=email/phone 時必填）
  string phone = 6; // 手機號（register_method=phone 時必填）
  string captcha_id = 7; // 圖形驗證碼 ID（captcha_register 開啓時必填）
  string captcha_code = 8; // 圖形驗證碼（4 位數字）
}

message SendRegisterCodeRequest {
  string target = 1 [(google.api.field_behavior) = REQUIRED]; // 郵箱或手機號
  string channel = 2; // email | phone（空則按 target 格式自動判定）
  string captcha_id = 3; // 圖形驗證碼 ID（captcha_register 開啓時必填）
  string captcha_code = 4; // 圖形驗證碼
}

message SendRegisterCodeReply {}

message RegisterReply {
  uint64 user_id = 1;
  string token = 2; // 註冊即登錄
  int64 expires_at = 3;
  string promo_code = 4; // 自己的推廣碼（註冊成功即擁有）
}

message LoginRequest {
  string username = 1 [(google.api.field_behavior) = REQUIRED]; // 用户名/郵箱/手機號混輸
  string password = 2 [(google.api.field_behavior) = REQUIRED];
  string captcha_id = 3; // 圖形驗證碼 ID（captcha_login 開啓時必填）
  string captcha_code = 4; // 圖形驗證碼
}

message LoginReply {
  string access_token = 1;
  string token_type = 2;
  int64 expires_at = 3;
}

message MeReply {
  uint64 user_id = 1;
  string username = 2;
  string email = 3;
  int64 created_at = 4;
  bool is_reseller = 5; // 分站主身份（approved）
  uint64 reseller_profile_id = 6;
  string promo_code = 7; // 推廣碼（懶生成）
}

message ForgotPasswordRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string captcha_id = 2; // 圖形驗證碼 ID（captcha_reset 開啓時必填）
  string captcha_code = 3; // 圖形驗證碼
}

message ForgotPasswordReply {}

message ResetPasswordRequest {
  string email = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED]; // 郵件驗證碼
  string new_password = 3 [(google.api.field_behavior) = REQUIRED]; // >= 6 位
}

message ResetPasswordReply {
  string token = 2; // 重置即登錄
  int64 expires_at = 3;
}

message ChangePasswordRequest {
  string old_password = 1 [(google.api.field_behavior) = REQUIRED];
  string new_password = 2 [(google.api.field_behavior) = REQUIRED];
}

message ChangePasswordReply {
  string token = 1; // 改密後吊銷全部 session；新 token 保當前會話
  int64 expires_at = 2;
}

message UpdateProfileRequest {
  string email = 1; // 新郵箱（空=不改；唯一性校驗）
}
