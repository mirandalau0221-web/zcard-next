syntax = "proto3";

package zcard.conf;

option go_package = "github.com/NovaWorks/zcard-next/server/internal/conf;conf";

import "google/protobuf/duration.proto";

// Bootstrap 為進程啓動配置（config.yaml 反序列化目標）。
// 運行時業務開關的真理源在 settings 表（鐵律 7），本文件只承載部署期配置。
message Bootstrap {
  Server server = 1;
  Data data = 2;
  Security security = 3;
  Tenancy tenancy = 4;
  Log log = 5;
}

message Server {
  message HTTP {
    string network = 1;  // tcp / unix
    string addr = 2;     // 0.0.0.0:8000
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;     // 0.0.0.0:9000
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  // 啓動時自動應用待執行遷移（加鎖串行，失敗拒絕啓動，規劃 §10.4）。
  bool migrate_on_start = 3;
  // 後台安全入口路徑（可配，規劃 §7.3；空 = /admin）
  string admin_base_path = 4;
}

message Data {
  message Database {
    // sqlite | mysql | postgres（運行時檢測方言，同一二進制三方言，ADR-D20）
    string driver = 1;
    // DSN。SQLite 為文件路徑（自動啓用 WAL + busy_timeout）
    string source = 2;
    int32 max_open_conns = 3;
    int32 max_idle_conns = 4;
    // 遷移目錄（默認內嵌；指向磁盤便於開發期調試）
    string migrations_dir = 5;
  }
  message Redis {
    string addr = 1;
    string password = 2;
    int32 db = 3;
    google.protobuf.Duration read_timeout = 4;
    google.protobuf.Duration write_timeout = 5;
  }
  Database database = 1;
  // Redis 可選：缺失時隊列同步降級 + 進程內緩存（ADR-D6）
  Redis redis = 2;
  // 工作進程模式（worker）獨立隊列併發度
  int32 worker_concurrency = 3;
}

// 四把鑰匙解耦（鐵律 §4.11.6）：env 注入優先，此處僅作兜底。
// 密鑰永不進 DB/日誌/git；生產環境必須經環境變量（ZCARD_*_KEY）注入。
message Security {
  // admin realm JWT 簽名密鑰（>= 32 字節）
  string jwt_admin_key = 1;
  // user realm JWT 簽名密鑰（與 admin 獨立，防提權串用）
  string jwt_user_key = 2;
  // 卡密加密密鑰（32 字節 hex；AES-256-GCM，與業務數據密鑰分離）
  string card_key = 3;
  // 業務數據加密密鑰（32 字節 hex；憑據列）
  string data_key = 4;
}

// 多租户（開源版僅啓用 Row 行級隔離；Schema/Database 屬商業版，ADR-D15）
message Tenancy {
  // row（開源版唯一取值；schema/database 為商業版預留）
  string mode = 1;
  // 主站域名（Host 匹配；分站域名走 reseller_sites 驗證，M3）
  string main_domain = 2;
}

message Log {
  // debug | info | warn | error
  string level = 1;
  // text | json
  string format = 2;
}
